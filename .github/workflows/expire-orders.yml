name: LOWKEY OTP Expiry

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  expire-orders:
    runs-on: ubuntu-latest

    steps:
      - name: Expire expired OTP orders
        run: |
          curl --fail --show-error --silent \
            --retry 3 \
            --retry-all-errors \
            --max-time 60 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://lowkey-otp-hub.vercel.app/api/cron/expire-orders"
